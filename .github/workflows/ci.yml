name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install -r requirements.txt
      - run: ruff check .
      - run: pytest -q
      - run: pytest tests/test_security_smoke.py -q
      - run: python evals/run_eval.py evals/golden.jsonl
